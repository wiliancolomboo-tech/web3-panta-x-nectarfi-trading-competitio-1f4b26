version: '3.8'

services:
  competition-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panta-nectar-engine
    restart: always
    environment:
      - RPC_URL=https://api.mainnet-beta.solana.com
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=engine@nectarfi.xyz
    volumes:
      - ./keys/oracle-authority.json:/app/keys/oracle.json:ro
    command: ["run-worker", "-k", "/app/keys/oracle.json", "-r", "https://api.mainnet-beta.solana.com", "-p", "PANTAnEcTAR11111111111111111111111111111111", "-c", "1"]
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"