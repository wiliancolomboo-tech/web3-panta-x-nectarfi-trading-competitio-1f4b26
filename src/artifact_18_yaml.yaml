version: "3.8"

services:
  competition-relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panta-nectar-relayer
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"