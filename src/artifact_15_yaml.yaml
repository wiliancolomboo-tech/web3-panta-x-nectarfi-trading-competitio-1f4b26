version: "3.8"

services:
  arena-crank:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panta-nectar-crank
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - ARENA_PROGRAM_ID=Arena11111111111111111111111111111111111111
      - ORACLE_SECRET_KEY=${ORACLE_SECRET_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"