version: "3.9"

services:
  pne-agent:
    build: .
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - ORACLE_PRIVATE_KEY=[1,2,3...255] # Mount via Doppler / AWS Secrets
      - PROGRAM_ID=PNEcmp9999999999999999999999999999999999999
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...
      - RESEND_API_KEY=re_123456789
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"