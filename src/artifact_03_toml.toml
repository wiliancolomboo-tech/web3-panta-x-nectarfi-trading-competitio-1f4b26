[package]
name = "panta_nectar_arena"
version = "0.1.0"
description = "Panta x NectarFi Verifiable Trading Competition Arena"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "panta_nectar_arena"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }