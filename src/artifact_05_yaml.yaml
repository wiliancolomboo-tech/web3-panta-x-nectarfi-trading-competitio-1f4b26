version: "3.8"

services:
  competition-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panta-nectar-engine-worker
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - COMPETITION_ID=1001
      - PROGRAM_ID=PNECTar111111111111111111111111111111111111
      - ADMIN_PRIVATE_KEY_JSON=${ADMIN_PRIVATE_KEY_JSON}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"