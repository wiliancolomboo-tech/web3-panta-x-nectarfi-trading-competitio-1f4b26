version: '3.8'

services:
  competition-crank:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panta-nectar-crank
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=arena@nectar.fi
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s