version: "3.8"

services:
  competition-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panta_nectar_keeper
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=PANTAn1ck1111111111111111111111111111111111
      - KEEPER_KEYPAIR_PATH=/secrets/keeper-keypair.json
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789abcdef
      - SENDER_EMAIL=payouts@nectarfi.io
    volumes:
      - ./secrets:/secrets:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "require('./dist/index.js')"]
      interval: 30s
      timeout: 10s
      retries: 3