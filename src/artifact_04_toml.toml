[package]
name = "panta_nectar_competition"
version = "0.1.0"
description = "Verifiable Competitive Trading Protocol for Panta x NectarFi"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "panta_nectar_competition"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }